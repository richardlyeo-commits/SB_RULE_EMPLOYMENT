<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삼영운수 취업규칙 찾기</title>
<!--
  ★ 코드 버전: 20261004-02  (날짜-일련번호. 고칠 때마다 -03, -04 로 올리세요)
  ★ 구조: ① 디자인(style) → ② 화면 뼈대(body) → ③ 동작(script)
  ★ 이번 버전은 취업규칙 PDF(2026.07.01 개정) 전문 75개 조항 + 부칙을 그대로 담았습니다.
-->
<style>
/* ===== ① 디자인 영역 ===== */
/* 색깔 보관함: 여기 숫자만 바꾸면 전체 색이 바뀝니다 */
:root{--ink:#10233f;--sub:#4a5a70;--paper:#f4f6f9;--card:#fff;--line:#c5cfdc;--main:#0b4a8f;
  --danger:#c0262d;--mark:#ffe066;--fs:19px}  /* --fs = 기본 글자 크기 */
@media (prefers-color-scheme:dark){:root{--ink:#eef3fa;--sub:#a9b8cc;--paper:#0d1726;--card:#16233a;--line:#34465f;--main:#6db0ff;--danger:#ff7b80;--mark:#8a6d00}}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
body{background:var(--paper);color:var(--ink);line-height:1.7;padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px 0 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:800}
.ver{font-size:.7rem;color:var(--sub)}
button,select,input{font:inherit;color:inherit}
.size button{font-weight:800;border:2px solid var(--main);background:var(--card);color:var(--main);border-radius:10px;padding:2px 12px;margin-left:6px;cursor:pointer}
.notice{margin:12px 0;padding:10px 14px;border-radius:10px;background:#fff4cc;color:#4d3b00;font-size:.78rem;border:1px solid #e6cf7a}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:14px;border:2.5px solid var(--main);border-radius:12px;background:var(--card)}
.search button{border:0;border-radius:12px;padding:0 18px;font-weight:800;cursor:pointer;background:var(--card);border:2px solid var(--line);color:var(--sub)}
.hint{font-size:.72rem;color:var(--sub);margin:6px 2px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.chip{text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);font-size:.88rem;font-weight:700}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.tools select{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:.85rem}
.tools button{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:.8rem}
.count{font-size:.8rem;color:var(--sub);margin:4px 2px 10px}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* 결과 카드: 왼쪽 큰 번호표(버스 노선판처럼)로 조항 번호를 한눈에 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card.danger{border-color:var(--danger)}
summary{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.num{flex:0 0 auto;min-width:64px;text-align:center;border-radius:10px;padding:6px 8px;background:var(--main);color:#fff;font-weight:800;font-size:.85rem}
.card.danger .num{background:var(--danger)}
.tt{font-weight:800;font-size:1.05rem;line-height:1.35}
.tt small{display:block;font-weight:400;font-size:.72rem;color:var(--sub)}
.arrow{margin-left:auto;color:var(--sub);transition:transform .15s}
details[open] .arrow{transform:rotate(180deg)}
.txt{padding:4px 16px 16px;border-top:1px dashed var(--line);white-space:pre-line;font-size:.9rem;padding-top:12px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:26px 16px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<!-- ===== ② 화면 뼈대 영역 ===== -->
<div class="wrap">
  <div class="top">
    <div><h1>🚌 삼영운수 취업규칙 찾기</h1>
      <div class="ver">2026.07.01 개정 전문 · 화면 버전 20261001-02</div></div>
    <div class="size"><button onclick="changeSize(-1)" aria-label="글자 작게">가-</button><button onclick="changeSize(1)" aria-label="글자 크게">가+</button></div>
  </div>
  <p class="notice">📄 취업규칙 PDF 전문을 옮긴 화면입니다. 임금·퇴직금 등은 <b>단체협약·임금협정</b>에 따로 정해져 있습니다(제39·40조). 징계·해고 판단은 반드시 <b>원본 PDF</b>로 최종 확인하세요.</p>
  
    <div class="search">
    <!-- 버전: 20261004-03 (검색창 속성을 input 안에 올바르게 넣음) -->
    <!-- lang="ko"         : 이 칸은 한국어 입력용이라고 기기에 알려 줌 -->
    <!-- autocomplete="off": 이전에 쳤던 글자가 자동으로 뜨지 않게 함 -->
    <!-- spellcheck="false": 한글에 빨간 밑줄이 생기지 않게 함 -->
    <input id="q" type="search" lang="ko" autocomplete="off" spellcheck="false"
           placeholder="단어 또는 조항 번호 (예: 음주, 제51조)">
    <button onclick="clearAll()">지우기</button>
  </div>


  <div class="hint">단어를 띄어 쓰면 <b>모두 들어간</b> 조항만 찾습니다 (예: 음주 해고). 숫자만 쓰면 조항 번호로 찾습니다.</div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <select id="ch" aria-label="장 선택"></select>
    <button onclick="toggleAll(true)">모두 펼치기</button><button onclick="toggleAll(false)">모두 접기</button>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<script>
/* ===== ③ 동작 영역 ===== */

/* (1) 자료 창고: PDF에서 뽑은 조항 전체가 들어 있습니다. (수정하지 마세요. 규정이 바뀌면 PDF로 다시 만듭니다)
   n=조 번호, t=조 제목, c=소속 장, b=본문, s=1이면 부칙 */
const DATA = [{"n":1,"t":"목적","c":"제1장 총칙","b":"이 규칙은 삼영운수 주식회사(이하 \"회사\"라 한다)내의 직장 질서를 확립하고 회사의 발전과 능률을 증진시키기 위하여 사원의 채용 및 복무 등 제반 사항을 정함을 목적으로 한다."},{"n":2,"t":"준수의무","c":"제1장 총칙","b":"회사 및 사원은 이 규칙을 준수하고 상호 협력하여 회사가 건전하게 성장·발전할 수 있도록 노력하여야 한다."},{"n":3,"t":"사원의 정의","c":"제1장 총칙","b":"사원이라 함은 이 규칙이 정하는 절차를 거쳐 회사에 채용된 자를 말한다. 다만, 계약직, 단시간 근로자 등 별도의 정함이 있는 사원에 대하여는 이 규칙을 적용하지 않는다."},{"n":4,"t":"채용의 절차","c":"제2장 채용","b":"① 회사는 서류전형 및 실기시험을 거쳐 면접에 합격한 자를 수습 또는 시용사원으로 채용한다.\n② 수습 또는 시용기간을 거쳐 채용된 자에 한하여 정식채용이 확정된다.\n③ 취업희망자는 다음 서류를 제출하여야 한다. 다만 회사는 직종에 따라서 일부 서류의 제출을 요구하지 않을 수 있다.\n1. 자필이력서 1부\n2. 주민등록등본 3부\n3. 주민등록초본 1부\n4. 건강진단서(지정 또는 종합병원 검사) 1부\n5. 자격증사본(운전면허증, 자격증 등) 1부\n6. 운전경력증명서(1년 이상 인감첨부 등 필요서류) 1부\n7. 신원보증서 또는 재정보증서 1부\n8. 운전정밀검사 판정표 1부\n9. 사고기록 확인서(면허시험장 발행) 1부\n10. 사진(명함1, 반명함2)\n11. 친권자 및 후견인 동의서(18세 미만자) 1부\n12. 노동조합의 추천서\n13. 그 밖에 회사가 요청하는 서류\n④ 사원은 상기 구비서류 및 제출된 이력사항의 내용변경이 있는 경우에는 사유 발생일로부터 15일 이내에 해당 증빙서류첨부하여 회사에 신고하여야 한다."},{"n":5,"t":"수습 및 시용","c":"제2장 채용","b":"① 신규 채용자는 채용일로부터 3개월을 수습 또는 시용기간으로 할 수 있다.\n② 수습·시용기간 중 또는 기간 만료 시에 아래 각호의 어느 하나에 해당하는 경우에는 정규직으로 채용하지 아니할 수 있다.\n1. 무단결근 1회\n2. 지각 2회\n3. 교통사고(대인, 대물) 1회 또는 각종 재해사고를 발생시킨 자\n4. 그 밖에 사원으로 근무시키는 것이 부적격하다고 인정되는 자\n③ 수습·시용기간은 근속년수에 통산하며 단체협약을 적용하지 않는다."},{"n":6,"t":"근로계약","c":"제2장 채용","b":"① 사원으로 채용된 자는 근로계약서를 체결하여야 한다.\n② 사원의 근로계약 기간은 1년으로 한다.\n③ 사원은 근로계약 기간이 만료되기 전에 근로계약을 갱신 체결하여야 한다.\n④ 회사는 근로계약을 해지하고자 하는 경우에는 1개월 전에 본인에게 통보하여야 한다.\n⑤ 근로계약 만료일 1개월 전에 해지통보가 없을 경우 근로계약은 1년간 연장된다."},{"n":7,"t":"복무의 기본 원칙","c":"제3장 복무","b":"① 사원은 회사의 방침, 취업규칙 등 제 규정 및 상사의 지휘명령을 성실히 이행하고, 업무에 전념하며 작업능률을 향상시키고 복무 질서를 준수하여야 한다.\n② 상사는 부하의 인격을 존중하고, 담당 업무를 지도 감독하여야 하며 솔선해서 그 직무를 수행하여야 한다."},{"n":8,"t":"복무규율","c":"제3장 복무","b":"사원은 다음 각 호의 사항을 준수하여야 한다.\n1. 건강에 유의하고 명랑한 태도로서 근무하여야 한다.\n2. 회사의 귀중한 재산과 승객의 안전을 위하여 성실히 근무하여야 한다.\n3. 회사 및 사원의 명예를 훼손하거나 신용을 손상시키는 행위를 하여서는 아니 된다.\n4. 회사의 기밀을 지키고 회사에 불이익한 언동을 하여서는 아니 된다.\n5. 부정한 행위를 하여 회사 및 사원의 체면을 손상시켜서는 아니 된다.\n6. 직무의 권한을 넘어서 독단적인 행위를 하여서는 아니 된다.\n7. 직무에 관해서 타인으로부터 부당한 금품을 받거나 요구하여서는 아니 된다.\n8. 재직한 상태에서 회사의 허가 없이 타 회사에 취업하여서는 아니 된다.\n9. 공직에 취임하거나 입후보할 때에는 사전에 회사에 신고하여야 한다.\n10. 음주, 졸음 및 과로 운전을 하여서는 아니 된다.\n11. 차량운행은 영업소 소장(배차주임을 포함한다. 이하 같다) 및 각 담당자의 지시에 따라야 한다.\n12. 승무직 사원은 임의로 대기를 해서는 아니 되고, 근무 대기 시에는 담당자의 승인을 얻어야 한다.\n13. 근무 중 교통사고 및 각종 재해발생 시 필요한 조치를 취한 후 지체 없이 안전재해예방부 및 영업소 소장에게 보고하고 그 지시에 따라야 한다.\n14. 각종 사고 발생 시 증거 및 증인 확보에 노력하여야 한다.\n15. 근무 중 공금 및 운송 수입금을 횡령· 착복하여서는 아니 된다.\n16. 근무 중 지정차량 고장 및 운행 중단 시에는 회사의 배차 및 업무지시에 따라야 한다.\n17. 재직 중 사업장 내·외에서 다른 사원들에게 무단으로 서명활동, 시위, 선동, 집단행동, 허위사실유포, 유인물배포 또는 게시 등으로 회사의 명예와 사내질서 및 노사 간의 신뢰를 훼손하게 하여서는 아니 된다."},{"n":9,"t":"직장 내의 질서유지","c":"제3장 복무","b":"사원은 직장 내의 질서유지를 위해 다음 각 호를 준수하여야 한다.\n1. 근무시간 중에 허가 없이 직장을 이탈하거나 직무를 태만히 해서는 아니 된다.\n2. 근무시간 중에 회사의 승인 없이 개인적인 사유로 외출, 면회 등을 해서는 아니 된다.\n3. 사내에서 불법행위를 하거나 타인의 업무를 방해해서는 아니 된다.\n4. 사내에서 도박, 언쟁 등 직장 내 풍기 및 질서를 문란하게 하는 행위를 하여서는 아니 된다.\n5. 회사가 지정하는 장소 이외에서 불을 피우거나 전열기 등의 화기를 사용해서는 아니 된다.\n6. 회사의 시설물, 장비 또는 비품 등을 훼손하여서는 아니 된다.\n7. 사내에서 문서 또는 인쇄물을 배포하거나 게시하고자 할 때에는 사전에 그 문서 및 인쇄물을 제시하여 회사의 허가를 받아야 한다.\n8. 근무시간에는 원칙적으로 소정의 작업복을 착용하여야 한다."},{"n":10,"t":"출근 및 퇴근의 규율","c":"제3장 복무","b":"① 사원은 출근 및 퇴근에 관하여 다음 각 호의 사항을 준수하여야 한다.\n1. 시업시각 이전에 출근하여 출근부에 날인하고, 소정의 작업복으로 갈아입은 후에 근무에 임해야 한다.\n2. 퇴근 시에는 일정한 장소에 차량을 주차 또는 입고시키고, 배차표와 운행일지 등 차량에 관한 이상 유무를 해당 담당자에게 보고 후 귀가하여야 한다.\n3. 출근 및 퇴근 시에는 정해진 장소를 통하여야 하고, 월담 등의 비정상적인 출입을 해서는 아니 된다.\n4. 부득이한 사유로 지각 또는 조퇴를 하고자 하는 자는 사전에 회사에 신고하고 승인을 얻어야 한다.\n5. 일상 휴대품 이외의 물품을 사업장 내에 가지고 들어오거나 회사의 물품을 가지고 나가고자 할 때에는 회사의 허가를 받아야 하고, 출·퇴근 시에 휴대품 검사를 요구하는 경우 정당한 이유 없이 검사를 거부하여서는 아니 된다.\n6. 퇴근은 장비, 공구, 책상, 비품 등을 정리한 후에 신속히 하여야 한다.\n7. 풍기질서를 문란하게 하여서는 아니 된다.\n8. 업무상 필요가 없는 위험품을 휴대하여서는 아니 된다.\n② 회사는 제1항 제7호 및 제8호에 해당하거나 해당할 우려가 있는 자 및 출근(승무)정지 또는 휴직(휴업)의 명령을 받은 자, 음주를 하여 근무가 부적당하다고 인정된 자, 그 밖에 근무가 불가능하다고 판단되는 자의 사업장 출입을 금지하거나 퇴거를 요구할 수 있다."},{"n":11,"t":"공민권 행사의 시간","c":"제3장 복무","b":"① 사원이 선거 그 밖에 공민으로서의 권리를 행사하기 위하여 사전에 신청하였을 경우에는 이에 필요한 시간을 줄 수 있다.\n② 회사는 제1항의 신청이 있는 경우 권리행사에 지장이 없는 한도 내에서 그 시각을 변경할 수 있다."},{"n":12,"t":"결근","c":"제3장 복무","b":"① 사원이 결근을 신청할 경우에는 3일 전에 증빙서류가 첨부된 결근계를 제출하여 회사의 승인을 얻어야 하고, 구두 및 유선으로의 신고는 결근계 제출로 인정하지 않는다. 다만, 질병 등 부득이한 사유로 사전에 신고할 수 없는 경우에는 구두 및 유선으로 신고한 후 익일까지 본인 또는 가족이 증빙서류를 첨부하여 결근계를 제출하고 승인을 얻어야 한다.\n② 개인적 사유 및 질병으로 7일 이상 결근하고자 하는 경우에는 증빙서류 또는 의사의 진단서를 첨부하여 결근계를 제출하고 승인을 얻어야 하고, 최고 30일을 초과할 수 없다.\n③ 결근 기간 중의 휴무일은 결근일수로 본다."},{"n":13,"t":"공공용품, 회사시설의 관리보전","c":"제3장 복무","b":"사원은 다음 각 호의 사항을 준수하고 공공용품 및 회사시설을 소중히 관리하여야 한다.\n1. 회사의 차량, 기계, 기구 등은 소중히 취급하여야 하고, 재료, 연료, 소모품을 절약하여야 한다.\n2. 허가 없이 업무 이외의 목적으로 회사의 차량, 기계, 기구, 그 밖의 물품을 사용하여서는 아니 된다.\n3. 업무 이외의 목적으로 회사의 구내시설을 사용 하고자 할 때에는 사전에 회사의 허가를 받아야 하고, 사용 후에는 신속히 원상으로 해 놓아야 한다.\n4. 출입금지의 장소에 허가 없이 출입하여서는 아니 된다.\n5. 직장 내의 환경은 항상 정리정돈을 하여야 한다.\n6. 회사의 자재, 기계 및 자산 등을 사적인 목적으로 사용하거나 수리해서는 안되고, 타인을 시켜 이와 같은 행위를 하여서도 아니 된다.\n7. 임의로 회사의 건물, 장비, 기구를 부수거나 소각해서는 아니 된다."},{"n":14,"t":"근무시간 및 근무제도","c":"제4장 근로시간","b":"① 사원의 근무시간은 휴게시간을 제외하고 1일 8시간, 주 40시간으로 하되, 연장근로를 포함하여 주 52시간 범위 내에서 유연근로를 할 수 있다.\n② 사원의 근무제도는 다음과 같다.\n1. 운전직 사원: 1일 2교대 월 22일 근무제를 원칙으로 하며, 노사합의에 의거 격일제 12일 근무제로 한다.\n2. 정비직 사원: 월 26일 주간 근무제로 한다(당직 6일 포함).\n3. 배차직 사원\n가. 업무상 필요에 따라 2주 단위 탄력적 근로시간제를 시행한다.\n나. 탄력적 근로시간제의 단위기간은 2주로 하고, 2주간 평균하여 1주 소정근로시간은 40시간을 초과하지 않는다.\n다. 업무의 필요성에 따라 유연근로를 포함하여 근로형태를 변경할 수 있다.\n4. 그 밖의 사원(관리직 등): 주 40시간 근무제로 한다.\n③ 사원의 시업 및 종업시간은 다음과 같이 하되, 계절 및 그 밖의 사유에 의해서 변경할 수 있다.\n1. 운전직 사원: 시내버스 운전직의 특수성을 고려하여 각 노선별 실 배차 시간표에 준한다.\n2. 정비직 사원: 시업 08:00~종업 18:00(당직조 18:00~익일08:00)\n3. 배차직 사원: 09:00~익일 09:00\n4. 그 밖의 사원(관리직 등): 시업 09:00~종업 18:00"},{"n":15,"t":"휴게시간","c":"제4장 근로시간","b":"① 회사는 운전직 사원에게 여객자동차운수사업법에서 정한 휴식시간을 부여하고, 모든 사원에게 4시간 근로에 30분, 8시간 근로에 60분 이상의 휴게시간을 근무시간 중에 주어야 한다.\n② 사원의 휴게시간은 아래와 같이 하되, 계절 및 그 밖의 사유에 의해서 변경할 수 있다.\n1. 운전직 사원: 노선별 시간표에 의거 분할휴식 한다.\n2. 정비직 사원: 12:00~13:00\n3. 배차직 사원: 각 영업소의 휴게시간이 상이할 수 있어 개별 근로계약서에서 정한다.\n4. 그 밖의 사원(관리직 등): 휴식 12:00~13:00"},{"n":16,"t":"시간 외 근로","c":"제4장 근로시간","b":"① 회사는 사원 간 개별 합의 또는 노사 간의 합의에 의하여 업무상 필요한 경우에 연장 및 휴일근로를 할 수 있다.\n② 여성 사원에게는 야간근로(오후 10시부터 오전 6시까지의 근무)와 휴일근로를 시키지 않는다. 다만, 여성 사원의 동의를 받은 경우에는 예외로 한다.\n③ 18세 미만인 사원은 야간근로와 휴일근로를 시키지 않는다. 다만, 18세 미만자의 동의와 고용노동부 장관의 인가를 받은 경우에는 예외로 한다."},{"n":17,"t":"당직","c":"제4장 근로시간","b":"① 만 18세 이상의 사원을 소정 근무시간 외 또는 휴일에 숙직(소정 퇴근시간부터 익일 출근시간까지의 근무) 또는 일직근무(소정 출근시간부터 퇴근시간까지의 근무)를 시킬 수 있다. 다만 여성 사원에 대해서는 숙직근무를 시키지 않는다.\n② 회사는 당직 근무자에게 대하여는 당직비를 지급할 수 있다."},{"n":18,"t":"출장자의 근무시간","c":"제4장 근로시간","b":"사원이 출장 그 밖의 회사의 업무로 사업장 외에서 근무할 경우에는 통상근무시간인 8시간을 근무한 것으로 본다. 다만, 회사가 사전에 별도의 지시를 한 때에는 그러하지 않는다."},{"n":19,"t":"유급휴일","c":"제5장 휴일 및 휴가","b":"사원의 휴일은 다음과 같이 하며 업무상 필요한 경우에는 다른 날로 대체할 수 있다.\n① 주휴일\n1. 일주일 간의 소정 근무일수를 개근한 자에 한하여 1주일에 1일의 주휴일을 부여한다.\n2. 업무의 특수성을 감안하여 격일제 근무자, 정비직, 주유원, 미화원 및 조리원 등의 주휴일은 매주 첫째 휴무일을 주휴일로 대체 부여하되, 합의에 의해 조정할 수 있다.\n② 근로자의 날(5월 1일)\n③「관공서의 공휴일에 관한 규정」에 따른 공휴일 및 대체공휴일\n④ 기타 유급휴일: 기타 유급휴일은 단체협약 제35조의 규정에 따른다."},{"n":20,"t":"연차 유급 휴가","c":"제5장 휴일 및 휴가","b":"① 1년간 80퍼센트 이상 출근한 사원에게 15일의 연차유급휴가를 주어야 한다.\n② 계속하여 근로한 기간이 1년 미만인 사원 또는 1년간 80퍼센트 미만 출근한 사원에게는 1개월 개근 시 1일의 유급휴가를 주어야 한다.\n③ 제1항의 휴가일수 중 근속가산분은 별도 산정하여 가산한다.\n④ 제1항과 제2항 규정에 의한 휴가청구권은 1년(계속하여 근로한 기간이 1년 미만인 근로자의 제2항에 따른 유급휴가는 최초 1년의 근로가 끝날 때까지의 기간을 말한다)간 행사하지 않은 경우 소멸된다.\n⑤ 연차 유급 휴가는 5일 전에 서면으로 신청하여 회사의 승인을 얻어야 한다. 다만, 사업 운영(차량배차 등)에 막대한 지장이 있는 경우에는 일자를 조정해서 승인할 수 있다."},{"n":21,"t":"생리휴가","c":"제5장 휴일 및 휴가","b":"여성 사원에게는 월 1일의 무급 생리휴가를 본인이 청구하는 시기에 줄 수 있다."},{"n":22,"t":"난임치료휴가","c":"제5장 휴일 및 휴가","b":"회사는 사원이 인공수정 또는 체외수정 등 난임치료를 받기 위하여 휴가를 청구하는 경우에는 연간 3일 이내의 휴가를 주어야 하며, 이 경우 최초 1일은 유급으로 한다. 다만, 해당 사원이 청구한 시기에 휴가를 주는 것이 정상적인 회사 운영에 지장을 초래하는 경우에는 사원과 협의하여 그 시기를 변경할 수 있다."},{"n":23,"t":"태아검진 시간의 허용 등","c":"제5장 휴일 및 휴가","b":"회사는 임신한 여성 사원이 모자보건법에 따른 임산부 정기건강진단을 받는데 필요한 시간을 청구하는 경우에는 이를 허용한다."},{"n":24,"t":"산전·후 휴가 등","c":"제5장 휴일 및 휴가","b":"① 임신 중의 여성 사원에 대하여는 산전·후를 통하여 90일[60일 유급(통상임금), 30일 무급]간의 휴가를 준다. 다만 휴가는 산후에 45일 이상이 확보되도록 한다.\n② 임신 중인 여성 사원이 유산의 경험 등 근로기준법이 정하는 사유로 제1항의 휴가를 청구하는 경우 출산 전 어느 때라도 휴가를 나누어 사용할 수 있도록 한다. 이 경우 출산 후의 휴가 기간은 연속하여 45일(한 번에 둘 이상 자녀를 임신한 경우에는 60일) 이상이 되어야 한다.\n③ 임신 중의 여성 사원에게는 연장근로를 시키지 아니하고, 그 사원의 요구가 있는 경우에는 쉬운 종류의 근로로 전환시킨다.\n④ 회사는 임신 후 12주 이내 또는 36주 이후에 있는 여성 사원이 1일 2 시간의 근로시간 단축을 신청하는 경우 이를 허용하여야 한다. 다만, 1일 근로시간이 8시간 미만인 사원에 대하여는 1일 근로시간이 6시간이 되도록 근로시간 단축을 허용할 수 있다.\n⑤ 회사는 제4항에 따른 근로시간 단축을 이유로 해당 사원의 임금을 삭감하지 아니한다.\n⑥ 회사는 임산부 등 여성 사원에게 근로기준법 제65조에 따른 도덕상 또는 보건상의 유해·위험한 직종에 근로시키지 아니한다.\n⑦ 회사는 임신 중인 여성 사원이 1일 소정근로시간을 유지하면서 업무의 시작 및 종료 시각의 변경을 신청하는 경우 이를 허용하여야 한다. 다만, 정상적인 사업 운영에 중대한 지장을 초래하는 경우 등 대통령령으로 정하는 경우에는 그러하지 아니하다.\n⑧ 회사는 사원이 배우자의 출산을 이유로 휴가를 청구하는 경우에 10일의 휴가를 주어야 한다. 이 경우 사용한 휴가기간은 유급으로 한다."},{"n":25,"t":"유산 및 사산 휴가","c":"제5장 휴일 및 휴가","b":"임신 중인 여성 사원이 유산 또는 사산한 경우로서 해당 사원이 청구하는 경우에는 근로기준법에 따른 휴가를 부여한다. 다만, 모자보건법에서 허용되지 않는 인공중절 수술은 제외한다."},{"n":26,"t":"육아시간","c":"제5장 휴일 및 휴가","b":"생후 1년 미만의 유아를 가진 여성 사원의 청구가 있으면 근무시간 중 소정의 휴게시간 이외에 1일 2회 각각 30분 이상의 유급 수유 시간을 준다."},{"n":27,"t":"육아휴직","c":"제5장 휴일 및 휴가","b":"① 회사는 6개월 이상 근무한 사원 중 임신 중인 여성 근로자가 모성을 보호하거나 사원이 만 8세 이하 또는 초등학교 2학년 이하의 자녀를 양육하기 위하여 육아휴직을 청구하는 경우에는 이를 허용한다.\n② 육아휴직기간은 1년 이내로 한다."},{"n":28,"t":"육아기 근로시간 단축","c":"제5장 휴일 및 휴가","b":"① 회사는 사원이 만 8세 이하 또는 초등학교 2학년 이하의 자녀를 양육하기 위하여 근로시간의 단축(이하 \"육아기 근로시간 단축\"이라 한다)을 신청하는 경우에 이를 허용하여야 한다. 다만, 단축개시예정일의 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만인 경우, 대체인력 채용이 불가능한 경우, 정상적인 사업 운영에 중대한 지장을 초래하는 경우 등 남녀고용평등법 시행령 제15조의2에 해당하는 경우에는 그러하지 아니하다.\n② 회사가 육아기 근로시간 단축을 허용하지 아니하는 경우에는 해당 사원에게 그 사유를 서면으로 통보하고 육아휴직을 사용하게 하거나 그 밖의 조치를 통하여 지원할 수 있는지를 해당 사원과 협의하여야 한다.\n③ 회사가 해당 사원에게 육아기 근로시간 단축을 허용하는 경우 단축 후 근로시간은 주당 15시간 이상이어야 하고 35시간을 넘어서는 아니 된다.\n④ 육아기 근로시간 단축의 기간은 1년 이내로 한다. 다만, 육아휴직을 신청할 수 있는 사원이 육아휴직 기간 중 사용하지 아니한 기간이 있으면 그 기간을 가산한 기간 이내로 한다.\n⑤ 회사는 제3항에 따라 육아기 근로시간 단축을 하고 있는 사원에 대하여 근로시간에 비례하여 적용하는 경우 외에는 육아기 근로시간 단축을 이유로 그 근로조건을 불리하게 하지 아니한다.\n⑥ 회사는 육아기 근로시간 단축을 하고 있는 사원에게 단축된 근로시간 외에 연장근로를 요구할 수 없다. 다만, 그 사원이 명시적으로 청구하는 경우에는 회사는 주 12시간 이내에서 연장근로를 시킬 수 있다.\n⑦ 사원은 육아기 근로시간 단축을 나누어 사용할 수 있다. 이 경우 나누어 사용하는 1회의 기간은 3개월 이상이 되어야 한다."},{"n":29,"t":"가족돌봄휴가","c":"제5장 휴일 및 휴가","b":"① 회사는 사원이 가족의 질병, 사고, 노령 또는 자녀의 양육으로 인하여 긴급하게 그 가족을 돌보기 위한 휴가를 신청하는 경우에는 이를 허용하여야 한다. 다만, 사원이 청구한 시기에 가족돌봄휴가를 주는 것이 정상적인 사업 운영에 지장을 초래하는 경우에는 사원과 협의하여 그 시기를 변경할 수 있다.\n② 가족돌봄휴가 기간은 연간 최장 10일로 하며, 일 단위로 사용할 수 있고, 남녀고용평등과 일·가정 양립 지원에 관한 법률, 한부모가족지원법 등 관련법령에 따라 그 기간을 연장할 수 있다. 다만, 가족돌봄휴가 기간 은 가족돌봄휴직 기간에 포함된다."},{"n":30,"t":"가족돌봄휴직","c":"제5장 휴일 및 휴가","b":"① 회사에서 6개월 이상 근무한 사원 중 사원이 가족의 질병, 사고, 노령으로 인하여 그 가족을 돌보기 위하여 휴직을 청구하는 경우 연간 90일 이내, 1회 30일 이상의 휴직을 허용한다.\n② 회사는 제1항에 해당하는 경우라도 남녀고용평등과 일·가정 양립 지원에 관한 법률에서 정한 사유에 해당하는 경우에는 휴직 및 휴가를 허용하지 아니할 수 있다."},{"n":31,"t":"가족돌봄을 위한 근로시간 단축","c":"제5장 휴일 및 휴가","b":"① 회사는 사원이 다음 각 호의 어느 하나에 해당하는 사유로 근로시간의 단축을 신청하는 경우에 이를 허용하여야 한다. 다만, 가족 돌봄 등 단축개시 예정일의 전날까지 해당 사업에서 계속 근로한 기간이 6개월 미만의 사원이 신청한 경우, 대체인력 채용이 불가능한 경우 또는 정상적인 사업 운영에 중대한 지장을 초래하는 경우 등 남녀고용평등법에서 정한 사유에 해당하는 경우에는 그러하지 아니하다.\n1. 사원이 가족의 질병, 사고, 노령으로 인하여 그 가족을 돌보기 위한 경우\n2. 사원 자신의 질병이나 사고로 인한 부상 등의 사유로 자신의 건강을 돌보기 위한 경우\n3. 55세 이상의 사원이 은퇴를 준비하기 위한 경우\n4. 사원의 학업을 위한 경우"},{"n":32,"t":"경조휴가","c":"제5장 휴일 및 휴가","b":"① 사원이 다음 각 호의 어느 하나에 해당하는 경우에는 경조 휴가를 줄 수 있다.\n1. 본인의 결혼 : 5일 중 5일 유급(1일8시간=통상임금)\n2. 자녀의 결혼 : 1일 중 1일 유급(1일8시간=통상임금)\n3. 부모의 사망 : 5일 중 5일 유급(1일8시간=통상임금)\n4. 배우자의 사망 : 5일 중 5일 유급(1일8시간=통상임금)\n5. 처부모의 사망 : 5일 중 5일 유급(1일8시간=통상임금)\n6. 조부모의 사망 : 2일 중 1일 유급(1일8시간=통상임금)\n7. 자녀의 사망 : 5일 중 5일 유급(1일8시간=통상임금)\n8. 부모의 탈상 : 1일 무급\n9. 배우자의 탈상 : 1일 무급\n② 제1항에 따른 경조휴가 대상자는 부득이한 경우를 제외하고 해당 증빙서류를 첨부하여 3일 전에 신청하여야 한다."},{"n":33,"t":"휴직","c":"제6장 인사","b":"① 사원이 다음 각 호의 어느 하나에 해당하는 경우에는 무급휴직을 줄 수 있다.\n1. 회사의 필요에 의해서 타 회사의 업무에 종사하게 한 때 -- 필요한 기간\n2. 회사의 승인을 얻어 공직에 전임하게 된 때 ------------전임기간\n3. 업무상 공상 등에 의하여 휴직을 요할 때 ----------- 치료 기간내\n4. 일신상 사정으로 30일 이상 근무가 불가능할 때 -------- 60일 이내\n5. 교통사고 및 형사사건으로 소추되었을 때 ----------1심판결시까지\n6. 운전면허정지 사유가 발생한 때 ----------------- 60일이내\n7. 병역법 및 전시근로 동원 등의 징·소집에 응하였을 때 ---- 동원기간내\n8. 회사 인사(상벌)위에 회부 시 소명자료의 준비기간 ------ 10일 이내\n② 제1항에 의하여 휴직중인 사원은 휴직사유가 소멸되면 바로 원직에 복직하여야 한다.\n③ 제1항의 휴직기간은 근속년수에 산입한다."},{"n":34,"t":"퇴직","c":"제7장 퇴직","b":"① 사원이 다음 각 호의 어느 하나에 해당하는 경우에는 퇴직 처리한다.\n1. 본인이 사망한 때\n2. 정년에 달한 때\n3. 사직서를 제출하고 이를 승인한 때\n4. 업무상 상병으로 요양 중인 자에게 근로기준법 또는 산재보상법 등에 의한 일시보상을 한 때\n5. 근로계약 기간이 만료되어 근로계약이 종료되었을 때\n6. 제33조 제1항 각 호의 어느 하나의 휴직기간 만료일까지 휴직사유가 소멸하지 아니한 때\n7. 각종 질환(정신이상, 난치병, 전염병, 신체장애 등)으로 근무 부적격자(버스운행 또는 사무업무가 불가능 한 자)로 판명된 자\n8. 채용의 조건이 된 면허증 또는 자격증이 취소 또는 상실된 자\n② 제1항 제3호에 의하여 퇴직하고자 하는 경우에는 퇴직 희망일의 14일 전까지 그 이유를 명시하여 회사에 사직서를 제출하여야 한다.\n③ 제2항에 의하여 사직서를 제출한 자는 퇴직 시까지 성실하게 종전의 업무를 수행하고 인수인계 하여야 한다."},{"n":35,"t":"해고","c":"제7장 퇴직","b":"사원이 다음 각 호의 어느 하나에 해당하는 경우에는 해고한다.\n1. 정신적 또는 신체적인 장해로 인하여 직무를 감당하기 어렵다고 인정된 자\n2. 회사를 상대로 무고한 진정 및 고소·고발 등의 행위를 한 자 또는 대외적으로 회사의 명예를 훼손 또는 이에 준하는 행위를 한 자\n3. 업무능력 또는 근무성적이 현저하게 불량한 자(연간 출근일수 8할미만 또는 마일리지 등 인사고과 평가가 불량한 자)\n4. 교통사고 등 각종 위법행위로 인하여 형사적 처벌을 받거나 구속된 자\n5. 회사에 제출한 이력사항과 경력 등 각종 서류의 내용을 허위로 기재하거나 누락시켜 제출한 자\n6. 재직 중 사업장 내·외에서 다른 사원에게 무단으로 서명 활동, 시위선동, 집단행동, 허위사실유포, 유인물 배포 또는 게시 등으로 회사 또는 임·직원의 명예를 훼손한 자 또는 사내질서 및 노사 간의 신뢰를 훼손 시킨 자\n7. 징계해고에 해당하는 행위가 있다고 인정된 자.\n8. 그 밖에 사업의 축소, 폐쇄, 설비변경 등의 필요가 있는 경우"},{"n":36,"t":"해고금지기간","c":"제7장 퇴직","b":"제35조에 불구하고 다음 각 호의 어느 하나에 해당하는 경우에는 해고하지 않는다. 다만 천재지변 그 밖의 부득이한 사유로 인하여 사업이 계속 불가능하게 된 경우 또는 업무상 상병에 의하여 2년을 경과하여도 치유되지 않는 사원에게 일시보상을 행한 경우에는 그러하지 아니하다.\n1. 업무상 상병에 의한 요양으로 휴직하는 기간 및 그 후 30일간\n2. 산전·후에 여성 사원이 이 규칙에 따라 휴직하는 기간 및 그 후 30일간"},{"n":37,"t":"해고예고","c":"제7장 퇴직","b":"사원을 해고하는 경우에는 30일전에 예고하여야 하며, 그렇지 않을 경우에는 30일분의 통상임금을 지급한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우에는 그러하지 아니하다.\n1. 근로자가 계속 근로한 기간이 3개월 미만인 경우\n2. 천재ㆍ사변, 그 밖의 부득이한 사유로 사업을 계속하는 것이 불가능한 경우\n3. 근로자가 고의로 사업에 막대한 지장을 초래하거나 재산상 손해를 끼친 경우로서 고용노동부령으로 정하는 사유에 해당하는 경우"},{"n":38,"t":"정년퇴직","c":"제7장 퇴직","b":"사원의 정년은 다음과 같고, 정년에 달한 월의 말일에 퇴직하는 것으로 한다. 다만, 회사가 업무상 필요하다고 인정한 자와 건강에 지장이 없고 연간 총 근무일수의 9할 이상을 근무하고, 회사의 전직, 전근 등 제반 업무지시를 성실히 수행한 자는 촉탁(임시직)사원으로 채용할 수 있으며 기간 및 임금은 별도로 정한다.\n1. 운전직·정비직: 만 65세\n2. 그 밖의 사원: 만 60세"},{"n":39,"t":"퇴직금","c":"제7장 퇴직","b":"사원의 퇴직금에 대해서는 별도로 정하는 단체협약에 의한다. 다만, 단체협약을 적용받지 아니하는 사원에 대해서는 근로자퇴직급여보장법에 따른다"},{"n":40,"t":"임금","c":"제8장 임금 및 복리후생","b":"① 사원의 임금, 상여금, 그 밖의 수당에 대해서는 별도로 정하는 임금협정 및 단체협약에 의한다. 다만, 그 밖의 사원에 대해서는 개별근로계약으로 정한다.\n② 관리직 사원 중 직무수당 지급 대상자는 계속 근무기간 1년 이상, 월 15일 이상의 실 근무 조건을 충족한 경우 지급하고, 금액은 개별 근로계약으로 정한다."},{"n":41,"t":"복리후생","c":"제8장 임금 및 복리후생","b":"사원은 회사가 사원을 위하여 설치한 복리후생시설 및 보건시설을 이용할 수 있다."},{"n":42,"t":"경조위로금","c":"제8장 임금 및 복리후생","b":"사원의 경조(결혼, 사망)시에는 회사가 결정하는 경조 위로금을 지급할 수 있다."},{"n":43,"t":"여비","c":"제8장 임금 및 복리후생","b":"업무상 출장을 가는 경우에는 교통비 및 숙박비의 실비 합계액을 여비로 지급할 수 있다."},{"n":44,"t":"인사위원회","c":"제9장 표창 및 징계","b":"사원의 표창 및 징계 그 밖의 인사문제를 심의하기 위하여 위원장을 포함하여 7명 이내의 인사위원을 임명하며, 간사는 노무담당 부서장 또는 사원 중에서 임명할 수 있다."},{"n":45,"t":"인사위원회 운영","c":"제9장 표창 및 징계","b":"표창 및 징계 등 인사위원회의 운영은 인사위원 과반수의 출석과 출석위원 과반수의 찬성으로 의결해서 결정하며 회의록을 작성 비치하여야 한다."},{"n":46,"t":"표창","c":"제9장 표창 및 징계","b":"① 사원이 다음 각 호의 어느 하나에 해당한 경우에는 인사위원 회 심의를 거쳐 표창한다.\n1. 근무성적 또는 기술이 우수하여 타 사원의 규범이 된 자.\n2. 재해를 미연에 방지하거나 비상시에 특별한 공로가 있는 자\n3. 업무상 유익한 발명, 개량 또는 연구 고안을 한 자\n4. 그 밖에 선행 또는 공로가 있어 회사의 명예와 발전에 기여한 자\n② 제1항의 표창에 대하여는 상장 이외에 상품 또는 상금을 수여할 수 있다."},{"n":47,"t":"징계","c":"제9장 표창 및 징계","b":"① 징계는 종류는 다음과 같다.\n1. 경고\n2. 견책\n3. 감봉(감급)\n4. 승무정지(운전직)\n5. 출근정지(운전직을 제외한 사원)\n6. 징계해고\n② 제1항의 징계종류가 같은 징계사유가 2회 이상 발생하는 경우에는 비위행위를 종합 판단하여 한 단계 가중하여 징계할 수 있다."},{"n":48,"t":"징계의 절차","c":"제9장 표창 및 징계","b":"사원을 징계하고자 할 때는 다음의 절차를 따른다.\n1. 승무(출근)정지 이상의 징계는 인사위원회에서 심의 결정한다.\n2. 감봉 이상의 징계 시에는 서면 또는 인사위원회 출석을 통한 소명의 기회를 주어야 하고, 승무(출근)정지 이상의 징계 시에는 소명자료의 준비 등을 위하여 10일 이내의 무급휴직 기간을 줄 수 있다.\n3. 본인이 서면 또는 인사위원회 출석을 통한 소명을 포기할 경우에는 서면 소명서나 인사위원회 출석 없이 심의 결정할 수 있다."},{"n":49,"t":"경고사유","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나를 위반한 자는 훈계하며 경고한다.\n1. 지각1회\n2. 경미한 운행질서문란자 또는 운행질서 위반자\n3. 근무 불성실한 자[조퇴, 지정근무(배차)일 회피(빠짐), 중도운휴 등]\n4. 사원의 품위를 상실한 자\n5. 부주의 또는 과실로 인해 경미한 교통사고를 발생시켜 피해액(대인, 대물 합계)이 50만원 미만인 자\n6. 그 밖에 제1호 내지 제5호에 준하는 귀책사유가 있는 자"},{"n":50,"t":"견책사유","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나를 위반한 자는 시말서를 징구하고 훈계한다.\n1. 정기 건강진단을 회피한 자\n2. 무단결근 1회 또는 지각 2회인 자\n3. 근무불성실 한 자[조퇴 2회, 지정근무(배차)일 2회 회피(빠짐)등] 또는 운행질서 문란 및 위반자\n4. 회사규칙 및 법령상 이수해야 할 교양 및 교육과정을 이수하지 아니한 자\n5. 회사규칙 및 관계법규 등을 위반하여 과징금 또는 벌과금에 해당하는 사유가 발생한 자\n6. 부주의 또는 과실로 인해 교통사고를 발생시켜 2주 미만의 인사사고 1명과 대물피해액의 합계가 100만원 미만인자\n7. 그 밖에 제1호 내지 제6호에 준하는 귀책사유가 있는 자"},{"n":51,"t":"감봉사유","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나를 위반한 자는 1회 금액이 평균임금의 1일분의 2분의 1을 감액하고, 총액이 임금총액의 10분의 1의 범위 이내로 감봉(감급)한다.\n1. 무단결근 2일 연속(휴무일 포함) 또는 1회의 지각이 20분 이상인 자\n2. 조퇴, 중도운휴 또는 지각이 월 2회 이상인 자\n3. 견책사유가 2개 이상 발생한 자\n4. 본인의 과실 또는 고의로 차량결행이 발생하고 운휴가 되었을 경우\n5. 승무 중 타 차량대체운행 거부 및 2회 이상의 배차(근무)일을 회피한 자\n6. 근무관련 책임자가 업무의 사전점검 및 책임을 소홀히 하여 사고 및 재해를 발생하게 한 자 또는 재산상의 손해를 발생하게 한 자\n7. 회사의 승인 없이 임의로 승무대기 또는 대리운전을 시킨 자와 이에 동조한 자\n8. 회사규칙 및 관계 법규 등을 위반하여 과징금 또는 벌과금에 해당하는 위반을 2회 발생하게 한 자\n9. 부주의 또는 과실로 회사의 명예를 훼손한 자\n10. 부주의 또는 과실로 인해 교통사고를 발생시켜 3주 미만의 인사사고 3명 이하 또는 3주 이상 인사사고 1명과 대물피해액의 합계가 500만원 미만인 자\n11. 근무일에 음주 또는 주취(숙취)상태로 운전을 하였거나 또는 운전을 하려고 출근한 운전기사에 대하여 회사자체로 실시한 음주측정 결과 아래 각 호의 어느 하나에 해당되는 자\n가. 회사에서 실시한 자체 음주측정 적발횟수가 1회에 해당하는 자\n나. 자체 음주측정 결과 측정기 음주표시 램프에 LOW로 점등될 때 또는 음주측정 수치가 0.03% 미만인 자. 다만, 음주측정 수치가 0.03% 미만인자 중에 측정 수치가 경미한 경우 견책 처분할 수 있다.\n12. 지정된 시기에 건강진단을 받지 않은 자\n13. 운수종사자 교육, 안전교육 등 관련법령에 따른 교육을 정해진 시기에 이수하지 아니한 자\n14. 그 밖에 제1호 내지 제12호에 준하는 귀책사유가 있는 자"},{"n":52,"t":"승무정지 및 출근정지 사유","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나를 위반한 자는 30일 이내의 승무정지 및 출근정지를 명하며 해당기간을 무급 처리한다.\n1. 무단결근을 계속해서 3일(휴무일 포함) 또는 누계 2회하고 지각 누계가 3회 이상이거나 견책 및 감봉(감급)등의 누계가 2회 이상인 자\n2. 전근 또는 근무전환 등 회사의 정당한 업무지시에 불응해 사내 규율을 문란하게 한 자\n3. 회사의 승인 없이 승무대기 또는 대리운전을 시켜 사고 및 재해를 발생하게 한 자 또는 이에 동조한 자\n4. 각종 사고 및 재해 등이 발생 시 신고 또는 보고를 하지 않고 회피하여 차량정지와 벌과금 납부 등 회사의 재산상에 손해를 끼친 자\n5. 근무 중 회사의 업무지시 및 운행지시를 위반하고 각종 운행질서 문란 및 위반으로 사내 규율을 위반한 자 또는 이에 동조한 자\n6. 사내에서 동료 간의 언쟁 및 폭행 등으로 차량의 결행과 운휴, 회사의 재물손괴 및 근무질서를 문란하게 한 자\n7. 승객과의 언쟁 등 불친절한 행위로 차량이 결행되거나 운휴를 발생하게 한 자\n8. 정당한 업무지시를 거부하거나 언쟁, 폭행 등으로 임·직원의 명예와 재산상의 손괴 등 회사의 위계질서를 문란하게 한 자\n9. 각종 민원발생(사고, 080민원, 적발 등)으로 사내질서문란 또는 회사의 명예를 훼손 한 자\n10. 정당한 사유없이 연간 협정근무일수가 90% 미만인 자 또는 연간 조퇴와 중도운휴가 각 5회 이상인 자\n11. 업무와 관련하여 허위보고 또는 허위기재 한 자\n12. 부주의 또는 과실로 인해 교통사고를 발생시켜 아래의 어느 하나에 해당하는 자\n가. 3주이상의 인사사고 2명 이상과 대물피해액이 100만원 이상 300만원 미만 자\n나. 1년 내 사고 2회 이상 또는 견책 3회 이상인 자\n다. 3주미만의 인사사고 3명 이하와 대물피해액이 100만원 이상 300만원 미만 자\n라. 대인·대물 손해피해액 합계가 500만원 이상 2000만원 미만 자\n13. 근무일에 음주 또는 주취(숙취)상태로 운전을 하였거나 또는 운전을 하려고 출근 한 운전기사에 대하여 회사자체로 실시한 음주측정 결과 아래 어느 하나에 해당되는 자\n가. 회사에서 실시한 자체 음주측정 결과 음주로 적발된 횟수가 2회째인 자\n나. 자체 음주측정 결과 측정기 음주표시 램프에 HIGH로 점등될 때 또는 음주측정 수치가 0.03%이상 0.08% 미만인 자\n14. 그 밖에 제1호 내지 제14호에 준하는 귀책사유가 있는 자"},{"n":53,"t":"징계해고 사유","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나에 해당하는 자는 징계해고 한다.\n1. 취업관련 서류의 허위기재(학력, 경력)또는 누락과 부정한 방법으로 채용된 자\n2. 회사의 승인 없이 임의로 대리운전 또는 타인운전 등으로 교통사고 및 안전사고를 발생시키거나 원인을 제공하여 중상자 이상 또는 대물 피해액 100만원 이상인 자\n3. 사직서를 제출하지 않고 타 직장에 재직한 자\n4. 상사 또는 동료와 업무수행 중인 사원에게 공갈협박 및 폭언, 폭행과 회사기물파괴 행위로 업무집행을 방해한 자\n5. 노선위반(정규노선이탈 또는 도중 회차)과 차량의 제반구조 장치 등을 임의로 조작한 자 또는 이를 알고 운행한 자\n6. 공금(현금 및 유가증권, 회수권)을 횡령 또는 착복하고 요금을 받아서 요금함(돈통)이외에 놓아둔 자.\n7. 도박, 절도, 폭행, 마약복용, 병역기피 등으로 사원간의 위화감 조성과 사회적 물의 등 회사의 명예를 훼손한 자.\n8. 각종 사고발생 또는 재해 발생 시 이를 은폐하거나 도주한 자.\n9. 근무일에 음주 또는 주취(숙취)상태로 운전을 하였거나 또는 운전을 하려고 출근 한 운전기사에 대하여 회사 자체로 실시한 음주측정 결과 아래 어느 하나에 해당되는 자\n가. 회사에서 실시하는 음주측정을 거부하는 자\n나. 정확한 근거 없이 회사 음주측정기를 의심하고 음주 측정결과를 부인하는 자\n다. 회사에서 실시한 음주 측정결과 음주로 적발된 횟수가 3회째 인 자\n라. 자체 음주 측정결과 측정기 음주표시 램프에 HIGH 상태로 점등 된 자로서 음주측정 수치가 0.080% 이상인 자\n10. 형사상 유죄판결 및 성년후견개시 또는 한정후견개시의 심판을 받은 자\n11. 회사의 서류를 무단복제 및 유출 또는 회사 기밀을 유출시킨 자\n12. 근무지와 근무차량의 무단이탈, 운행거부 또는 승무지시에 불응 또는 불복한 자\n13. 무단결근(휴무일 포함)을 계속해서 3회 이상하거나, 연간 누계가 7회 이상인 자\n14. 사업장에서 다른 사원에게 무단으로 서명활동, 시위, 선동, 집단행동, 허위사실 유포, 무단유인물 배포 또는 게시 등으로 회사의 명예와 사내질서 및 노사 간의 신뢰를 훼손한 자 또는 회사를 상대로 진정, 고소, 고발 및 허위사실을 유포하여 회사와 임·직원의 명예를 실추하고 노사 간의 신뢰를 훼손한 자\n15. 제14호를 위하여 사조직을 구성하는 자 또는 그 조직에 가입한 자.\n16. 견책 및 감봉(감급)등의 귀책으로 인한 누계가 3회 이상인 자 또는 승무(출근)정지 2회 이상의 징계를 받은 자.\n17. 부주의 또는 과실로 인해 교통사고를 연간 3회(대인, 대물)이상 발생하게 한 자.\n18. 수습사용 기간 중에 근무성적 불량 또는 각종 사고를 발생하게 하고 원인을 제공하여 정식 채용이 불가능 한 자.\n19. 근무성적이 현저히 불량하여(정당한 사유없이 연간 협정근로일수의 80%미달과 중간운휴 및 조퇴가 7회 이상) 계속해서 근로시키기가 부적합하다고 인정된 자\n20. 무정차, 과속난폭운전, 승차거부, 원거리주정차, 중앙선침범, 신호위반, 개문 운행, 정류장외 정차, 안내방송 미실시 등의 위반 행위와 근무 중 각종 운행질서 문란 및 위반으로 연간 3회 이상 적발 또는 신고된 자\n21. 부주의 또는 과실로 인해 교통사고를 발생시켜 아래 어느 하나에 해당되는 자\n가. 대인·대물 포함한 교통사고가 연간 3회 발생한 자와 6개월에 2회 발생한 자\n나. 중상 2명 이상, 사망 1명 이상, 중상 14주 이상인자\n다. 3주이상의 부상자 3명 이상 또는 부상자 총 6명 이상인자\n라. 2주이상의 대인사고 4명 이상과 대물 300만원 이상인 자\n마. 대인·대물의 손해피해액 합계가 2000만원 이상인자\n22. 회사와의 신뢰관계가 상실되게 함으로써 근로관계의 유지가 기대될 수 없도록 행동한 자\n23. 그 밖에 제1호 내지 제22호에 준하는 귀책사유가 있는 자"},{"n":54,"t":"징계의 경감","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나에 해당하는 자는 인사위원회의 결정에 따라 징계처분을 한 단계 감면 처분할 수 있다.\n1. 7년 이내 대표이사의 표창을 받은 자 또는 회사에서 추천하여 관공서 및 사회단체장의 표창을 받은 자\n2. 7년 이내 노동조합의 추천으로 관공서의 표창을 받은 자\n3. 과오를 자진신고 후 뉘우침이 분명하고 개전의 정이 뚜렷하다고 판단되는 자\n4. 재직 중 현저한 공적이 인정되어 대표이사가 특별히 감면처분을 명한 자"},{"n":55,"t":"징계통보","c":"제9장 표창 및 징계","b":"감봉 이상의 징계결정은 10일 이내 본인에게 그 결정내용을 서면으로 통지한다."},{"n":56,"t":"재심청구","c":"제9장 표창 및 징계","b":"다음 각 호의 어느 하나에 해당할 때는 제55조의 징계통보를 받은 날로부터 10일 이내 재심을 청구할 수 있다.\n1. 대표이사가 재심을 명할 경우\n2. 징계 결정이 부당하다는 뚜렷한 입증자료를 첨부하여 재심을 요청할 경우"},{"n":57,"t":"재심","c":"제9장 표창 및 징계","b":"재심청구가 접수된 날로부터 10일 이내 재심청구인 및 증인을 출석시켜 재심을 하여야 하고, 재심사유가 불분명하여 기각할 때는 10일 이내 재심청구서를 반송하여야 한다."},{"n":58,"t":"징계의 확정","c":"제9장 표창 및 징계","b":"징계의 확정은 징계결정 통지서의 송달일로부터 10일이 경과한 날 확정되며 재심 청구시에는 재심이 완료된 날 확정된다."},{"n":59,"t":"안전보건","c":"제10장 안전 보건","b":"① 회사는 안전보건관리규정을 별도로 정하여 사원의 안전 및 건강유지에 노력하여야 한다.\n② 회사는 매년 1회 정기 건강진단을 실시하며, 건강진단결과에 따라 근무중지, 직무 전환 및 퇴직 등의 조치를 할 수 있다.\n③ 사원은 근무(작업)를 시작할 때와 그 내용을 변경할 경우에는 위험방지의 조치를 취하고 안전주의 의무를 다하여야 한다."},{"n":60,"t":"직장 내 성희롱의 금지","c":"제11장 직장 내 성희롱의 금지","b":"회사의 모든 임원 및 사원은 남녀고용평등법에서 금지한 직장 내 성희롱에 해당하는 행위를 하여서는 아니 된다."},{"n":61,"t":"교양, 교육훈련","c":"제11장 직장 내 성희롱의 금지","b":"① 회사는 사원의 직무능력향상을 위하여 필요한 경우 교양 및 교육훈련을 시킬 수 있으며 사원은 교양, 교육과정에 성실히 임하여야 한다.\n② 회사는 직장 내 성희롱을 예방하고 사원이 안전한 근로환경에서 일할 수 있는 여건조성을 하고, 1년에 1회 이상 성희롱 관련 법령의 요지, 성희롱 예방을 위한 회사의 방침, 성희롱 피해자의 권리구제 방법과 가해자의 조치 등을 내용으로 성희롱 예방 교육(강사교육, 회람, 동영상 청취 등)을 실시한다."},{"n":62,"t":"직장 내 성희롱 발생 시 조치","c":"제11장 직장 내 성희롱의 금지","b":"직장 내 성희롱을 하여 물의를 일으킨 임·직원에 대하여는 징계할 수 있다. 이 경우에는 성희롱 피해자와 같은 장소에 근무하지 않도록 인사이동을 병행하여야 한다."},{"n":63,"t":"직장 내 괴롭힘 행위의 금지","c":"제12장 직장 내 괴롭힘의 예방","b":"① 직장 내 괴롭힘이란 임원 및 사원이 직장에서의 지위 또는 관계 등의 우위를 이용하여 업무상 적정범위를 넘어 다른 사원에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위를 말한다.\n② 사원은 다른 사원 뿐 아니라 협력사 사원에 대하여도 직장 내 괴롭힘 행위를 하여서는 아니 된다."},{"n":64,"t":"금지되는 직장 내 괴롭힘 행위","c":"제12장 직장 내 괴롭힘의 예방","b":"회사에서 금지되는 직장 내 괴롭힘 행위는 다음 각 호와 같다.\n1. 신체에 대하여 폭행하거나 협박하는 행위\n2. 지속·반복적인 욕설이나 폭언\n3. 다른 사원들 앞에서 또는 온라인상에서 모욕감을 주거나 개인사에 대한 소문을 퍼뜨리는 등 명예를 훼손하는 행위\n4. 합리적 이유 없이 반복적으로 개인 심부름 등 사적인 용무를 지시하는 행위\n5. 합리적 이유 없이 업무능력이나 성과를 인정하지 않거나 조롱하는 행위\n6. 집단적으로 따돌리거나, 정당한 이유 없이 업무와 관련된 중요한 정보 또는 의사결정 과정에서 배제하거나 무시하는 행위\n7. 정당한 이유 없이 상당기간 동안 근로계약서 등에 명시되어 있는 업무와 무관한 일을 지시하거나 근로계약서 등에 명시되어 있는 업무와 무관한 허드렛일만 시키는 행위\n8. 정당한 이유 없이 상당기간 동안 일을 거의 주지 않는 행위\n9. 그밖에 업무의 적정범위를 넘어 사원에게 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위"},{"n":65,"t":"직장 내 괴롭힘 예방교육","c":"제12장 직장 내 괴롭힘의 예방","b":"① 회사는 직장 내 괴롭힘 예방을 위한 교육을 1년에 1회 이상 실시한다.\n② 직장 내 괴롭힘 예방교육은 사내 노선별 밴드, 식당 내 TV시청, 온라인 교육, 그 밖의 집합 교육 등을 활용하여 실시할 수 있다.\n③ 직장 내 괴롭힘 예방교육의 내용은 다음 각 호와 같다.\n1. 직장 내 괴롭힘 행위의 정의\n2. 금지되는 직장 내 괴롭힘 행위\n3. 직장 내 괴롭힘 상담절차\n4. 직장 내 괴롭힘 사건처리절차\n5. 직장 내 괴롭힘 피해자 보호를 위한 조치\n6. 직장 내 괴롭힘 행위자에 대한 조치\n7. 그밖에 직장 내 괴롭힘 예방을 위한 내용\n④ 회사는 직장 내 괴롭힘 예방교육의 주요 내용을 항상 게시하거나 사원들이 열람할 수 있도록 조치한다."},{"n":66,"t":"직장 내 괴롭힘 예방‧대응 조직","c":"제12장 직장 내 괴롭힘의 예방","b":"회사 내 인사부서에 직장 내 괴롭힘의 예방‧대응 업무를 총괄하여 담당하는 직원(이하 “예방‧대응 담당자”라 한다)을 1명 이상 둔다."},{"n":67,"t":"직장 내 괴롭힘 행위 발생 시 조치","c":"제12장 직장 내 괴롭힘의 예방","b":"① 누구든지 직장 내 괴롭힘 발생 사실을 알게 된 경우에는 그 사실을 회사에 신고할 수 있다.\n② 회사는 제1항에 따른 신고를 접수하거나 직장 내 괴롭힘 발생 사실을 인지한 경우에는 지체 없이 그 사실 확인을 위한 조사를 실시한다."},{"n":68,"t":"사건의 접수","c":"제12장 직장 내 괴롭힘의 예방","b":"① 누구든지 직장 내 괴롭힘 발생 사실을 알게 된 경우 그 사실을 예방‧대응 담당자에게 신고할 수 있다.\n② 예방‧대응 담당자는 제1항에 따른 신고가 있는 경우 또는 그 밖의 방법으로 직장 내 괴롭힘 발생 사실을 인지한 경우 사건을 접수한다."},{"n":69,"t":"사건의 조사","c":"제12장 직장 내 괴롭힘의 예방","b":"① 회사는 직장 내 괴롭힘 신고를 접수하거나 직장 내 괴롭힘 발생 사실을 인지한 경우에는 지체 없이 그 사실 확인을 위한 조사를 실시한다.\n② 조사는 예방·대응 담당자가 담당한다.\n③ 조사가 종료되면 사업주에게 보고한다.\n④ 조사를 하는 경우 행위자에 대한 조치와 관련한 피해자의 의견을 들어야 한다.\n⑤ 조사자 등 조사 과정에 참여한 사람은 조사 과정에서 알게 된 비밀을 피해자 의사에 반하여 다른 사람에게 누설하여서는 아니 된다. 다만, 조사와 관련된 내용을 사업주에게 보고하거나 관계 기관의 요청에 따라 필요한 정보를 제공하는 경우는 제외한다."},{"n":70,"t":"피해자의 보호","c":"제12장 직장 내 괴롭힘의 예방","b":"①회사는 정식 조사기간 동안 피해자가 요청하는 경우에는 근무장소의 변경, 유급휴가 명령 등 피해자의 요청을 고려하여 적절한 조치를 한다. 이 경우 피해자의 의사에 반하는 조치를 하여서는 아니된다.\n② 회사는 직장 내 괴롭힘이 인정된 경우 피해자가 요청하면 근무장소의 변경, 배치전환, 유급휴가의 명령 등 적절한 조치를 한다.\n③ 회사는 신고인 및 피해자에게 해고나 그 밖의 불리한 처우를 하여서는 아니 된다."},{"n":71,"t":"직장 내 괴롭힘 사실의 확인 및 조치","c":"제12장 직장 내 괴롭힘의 예방","b":"사업주는 직장 내 괴롭힘이 인정된 경우 지체 없이 행위자에 대하여 징계, 근무장소의 변경 등 필요한 조치를 한다."},{"n":72,"t":"직장 내 괴롭힘 행위자에 대한 징계","c":"제12장 직장 내 괴롭힘의 예방","b":"직장 내 괴롭힘 행위를 한 자는 징계할 수 있고, 이 경우 제9장(표창 및 징계)를 준용한다."},{"n":73,"t":"고객의 폭언 등에 대한 조치","c":"제12장 직장 내 괴롭힘의 예방","b":"① 고객을 응대하는 업무를 주로 하는 사원이 고객으로부터 폭언, 폭행 등을 당한 경우 회사는 해당 사원의 업무를 일시적으로 중단 또는 전환하거나 일정시간 휴게시간을 연장, 건강장해 관련 치료 및 상담 지원, 고소 및 고발 또는 손해배상 청구 등을 하는데 필요한 조치 등을 취한다.\n② 회사는 고객응대사원의 건강장해를 예방하기 위하여 폭언 등을 하지 않도록 요청하는 문구 게시 또는 음성 안내를 하고, 고객응대매뉴얼을 구비하여 고객이 폭언 등 부적절한 행동을 하였을 때 사원이 자신을 보호하기 위하여 어떠한 방어행동을 할 수 있는지를 주지시키는 고객응대 업무 매뉴얼과 건강장해 예방 관련 교육 등의 필요한 조치를 하여야 한다.\n③ 일시적인 업무의 중단으로도 사원의 건강장해가 해소되지 않을 때에는 회사는 사원의 업무를 전환시켜야 한다.\n④ 회사는 사원이 고객의 폭언 등으로 인한 피해 복구를 위한 요구를 하였다는 이유로 해고나 그 밖에 불리한 처우를 하여서는 아니 된다."},{"n":74,"t":"업무상 재해의 보상","c":"제13장 재해보상","b":"① 사원이 업무상 사유에 의하여 부상을 당하거나 질병에 걸렸을 때 또는 이로 인하여 사망한 경우에는 근로기준법 등 관계법령에 따라 보상을 실시한다.\n② 제1항에 의해서 보상을 받아야 할 자가 동일한 사유에 의해서 산업재해보상보험법의 급여를 받은 경우에는 제1항의 규정을 적용하지 아니 한다."},{"n":75,"t":"준용규정","c":"제14장 보칙","b":"이 규칙에서 정하지 아니한 사항은 근로기준법 및 단체협약 등 관계법규에 따른다."},{"n":1,"t":"규칙의 효력","c":"부칙","b":"다른 규정과 지침 등이 이 규칙에서 정한 내용과 상충될 경우에는 이 규칙이 우선하고, 종전의 규칙은 이 규칙의 시행과 동시에 폐지한다.","s":1},{"n":2,"t":"경과조치","c":"부칙","b":"① 이 규칙 시행 전에 종전 규칙에 따라 입사 및 징계 등이 이루어진 경우에는 이 규칙에 의한 것으로 본다.\n② 이 규칙 시행일 전에 발생한 징계사유에 대하여는 이 규칙에 따라 징계한다.","s":1},{"n":3,"t":"시행","c":"부칙","b":"이 규칙은 2026년 7월 1일부터 시행한다.","s":1}];

const QUICK=[["🍺 음주 기준","음주"],["⚖️ 징계 종류","제47조"],["🏖️ 연차휴가","연차"],["🚌 교통사고","교통사고"],
  ["⏰ 근무시간","근무시간"],["🎉 경조휴가","경조"],["👶 육아","육아"],["🚪 해고","해고"],["⏳ 정년","정년"],["🧑‍🤝‍🧑 괴롭힘","괴롭힘"]];

/* (3) 비슷한 말: 왼쪽 말로 찾아도 오른쪽 말이 들어간 조항이 나옵니다 */
const SYN={"술":["음주","주취"],"쉬는날":["휴일","휴가"],"월차":["연차"],"사표":["사직"]};

const $=id=>document.getElementById(id);
const $q=$("q"),$ch=$("ch"),$list=$("list"),$count=$("count");

/* 검색용 한 줄 글자 만들기: 조항 이름표+제목+장+본문을 합쳐 둡니다 */
DATA.forEach(d=>{d.label=(d.s?"부칙 ":"")+"제"+d.n+"조"; d.hay=(d.label+" "+d.t+" "+d.c+" "+d.b).toLowerCase();});

/* 글자를 화면에 안전하게 넣기 위한 변환 */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

/* (4) 검색: 띄어 쓴 단어가 전부 들어간 조항만, 제목에 있으면 위로 */
function run(){
  const terms=$q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const res=[];
  for(const d of DATA){
    if($ch.value && d.c!==$ch.value) continue;          // 장 선택
    let score=0, ok=true;
    for(const t of terms){
      let s=0;
      const m=t.match(/^제?(\d+)조?$/);                    // "제51조" 또는 "51" 형태면 조항 번호 검색
      if(m){ if(!d.s && d.n==+m[1]) s=100; else if(d.hay.includes("제"+m[1]+"조")) s=1; }
      else for(const a of [t,...(SYN[t]||[])]){
        if(d.t.toLowerCase().includes(a)) s=Math.max(s,10); else if(d.hay.includes(a)) s=Math.max(s,1);
      }
      if(!s){ok=false;break;} score+=s;
    }
    if(ok) res.push({d,score});
  }
  const key=d=>(d.s?1000:0)+d.n;
  if(terms.length) res.sort((a,b)=>b.score-a.score||key(a.d)-key(b.d));
  /* 형광펜 칠할 단어 목록 */
  const hl=terms.flatMap(t=>{const m=t.match(/^제?(\d+)조?$/);return m?["제"+m[1]+"조"]:[t,...(SYN[t]||[])];});
  render(res.map(r=>r.d),hl,terms.length>0);
}

function mark(text,hl){
  let s=esc(text);
  hl.forEach(t=>{s=s.replace(new RegExp("("+reEsc(esc(t))+")","gi"),"<mark>$1</mark>");});
  return s;
}

/* (5) 결과를 카드로 그리기 (검색 중이면 앞의 12개는 펼쳐서 보여줌) */
function render(items,hl,searching){
  $count.textContent=items.length?(searching?"검색 결과 ":"전체 ")+items.length+"건":"";
  if(!items.length){$list.innerHTML='<div class="empty">😔 일치하는 조항이 없습니다.<br>다른 단어로 찾거나, 띄어쓴 단어를 줄여 보세요.</div>';return;}
  $list.innerHTML=items.map((d,i)=>`
   <details class="card ${d.c.includes("징계")?"danger":""}" ${searching&&(i<12||items.length<=3)?"open":""}>
    <summary><span class="num">${d.label}</span>
      <span class="tt">${mark(d.t,hl)}<small>${esc(d.c)}</small></span><span class="arrow">▾</span></summary>
    <div class="txt">${mark(d.b,hl)}</div>
   </details>`).join("");
}

function toggleAll(open){document.querySelectorAll("#list details").forEach(x=>x.open=open);}
function clearAll(){$q.value="";$ch.value="";run();$q.focus();}
function quick(w){$q.value=w;$ch.value="";run();window.scrollTo({top:0,behavior:"smooth"});}

/* (6) 글자 크기 조절 */
let fs=19;
function changeSize(step){fs=Math.min(26,Math.max(15,fs+step*2));document.documentElement.style.setProperty("--fs",fs+"px");}

/* (7) 시작: 버튼·장 목록 만들고, 글자 칠 때마다 바로 검색 */
$("chips").innerHTML=QUICK.map(q=>`<button class="chip" onclick="quick('${q[1]}')">${q[0]}</button>`).join("");
const chapters=[...new Set(DATA.filter(d=>!d.s).map(d=>d.c))];
$ch.innerHTML='<option value="">전체 장 보기</option>'+chapters.map(c=>`<option>${esc(c)}</option>`).join("")+'<option>부칙</option>';
$q.addEventListener("input",run);
$ch.addEventListener("change",run);
run();
</script>
</body>
</html>
