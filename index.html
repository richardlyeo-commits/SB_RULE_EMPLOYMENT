<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>삼영보영 취업규칙 AI 도우미</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #8fa1b0; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; background: #abc0d0; }
    
    .header { background: #343a40; color: #fff; padding: 14px; text-align: center; font-weight: bold; font-size: 16px; position: relative; }
    .key-toggle-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 14px; }
    
    .key-section { background: #212529; color: #fff; padding: 10px 12px; display: flex; gap: 6px; align-items: center; font-size: 12px; transition: all 0.3s ease; }
    .key-section.hidden { display: none; } /* 키 저장 완료 시 숨김 처리 */
    .key-section input { flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid #495057; background: #343a40; color: #fff; font-size: 12px; outline: none; }
    .key-section button { background: #ffeb33; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; color: #000; }

    .chat-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .bot { align-self: flex-start; background: #ffffff; color: #000; border-top-left-radius: 2px; }
    .user { align-self: flex-end; background: #ffeb33; color: #000; border-top-right-radius: 2px; }
    
    .quick-btns { display: flex; gap: 6px; padding: 8px 12px; background: #abc0d0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .quick-btn { background: #ffffff; border: 1px solid #ced4da; border-radius: 16px; padding: 6px 12px; font-size: 12px; white-space: nowrap; cursor: pointer; flex-shrink: 0; color: #000; }
    
    .input-area { display: flex; padding: 10px; background: #ffffff; gap: 8px; border-top: 1px solid #ddd; }
    .input-area input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 14px; font-size: 14px; outline: none; }
    .input-area button { background: #ffeb33; border: none; border-radius: 50%; width: 38px; height: 38px; font-weight: bold; cursor: pointer; color: #000; }
    .loading { color: #666; font-style: italic; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    삼영보영 취업규칙 AI 도우미
    <!-- 오른쪽 상단 ⚙️ 아이콘 클릭 시 API 키 설정창 열기/닫기 -->
    <button class="key-toggle-btn" onclick="toggleKeySection()" title="API Key 설정">⚙️</button>
  </div>
  
  <div class="key-section" id="keySection">
    <span>🔑 API Key:</span>
    <input type="password" id="apiKeyInput" placeholder="Gemini API 키를 입력해 주세요">
    <button onclick="saveKey()">저장</button>
  </div>

  <div class="chat-container" id="chat">
    <div class="msg bot" id="welcomeMsg">안녕하세요! 삼영보영 취업규칙 AI 도우미입니다. 질문을 입력해주시면 바로 답변해 드립니다.</div>
  </div>
  
  <div class="quick-btns">
    <button class="quick-btn" onclick="send('연차 유급 휴가 규정에 대해 알려줘')">연차 휴가</button>
    <button class="quick-btn" onclick="send('본인 결혼 시 경조휴가는 며칠인가요?')">경조 휴가</button>
    <button class="quick-btn" onclick="send('음주운전 적발 시 징계 기준이 어떻게 되나요?')">음주운전 징계</button>
  </div>
  
  <div class="input-area">
    <input type="text" id="userInput" placeholder="취업규칙에 대해 질문하세요..." onkeypress="if(event.keyCode==13) send()">
    <button onclick="send()">➔</button>
  </div>
</div>

<script>
  window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    const keySection = document.getElementById('keySection');
    const welcomeMsg = document.getElementById('welcomeMsg');

    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      // 키가 이미 저장되어 있으면 상단 입력창을 보이지 않게 숨김
      keySection.classList.add('hidden');
    } else {
      welcomeMsg.innerHTML = "안녕하세요! 삼영보영 취업규칙 AI 도우미입니다.<br>상단에 Gemini API 키를 등록 및 저장하신 후 질문해 주세요.";
    }
  };

  function saveKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert("API 키를 입력해 주세요.");
      return;
    }
    localStorage.setItem('gemini_api_key', key);
    alert("API 키가 저장되었습니다.");
    // 저장 후 상단 키 입력창 숨김 처리
    document.getElementById('keySection').classList.add('hidden');
  }

  // ⚙️ 버튼을 누르면 API 키 입력창을 켜고 끌 수 있는 기능
  function toggleKeySection() {
    const keySection = document.getElementById('keySection');
    keySection.classList.toggle('hidden');
  }

  const RULE_TEXT = `
  삼영운수 주식회사 취업규칙
  제14조(근무시간 및 근무제도) 운전직: 1일 2교대 월 22일 근무제 원칙 / 정비직: 월 26일 주간 근무제 / 배차직: 2주 단위 탄력적 근로시간제.
  제15조(휴게시간) 4시간 근로에 30분, 8시간 근로에 60분 이상 부여.
  제20조(연차 유급 휴가) 1년간 80% 이상 출근 시 15일 부여. 1년 미만 또는 80% 미만 출근 시 1개월 개근 시 1일 부여. 사용 5일 전 서면 신청.
  제32조(경조휴가) 본인 결혼 5일(유급), 자녀 결혼 1일(유급), 부모 사망 5일(유급), 배우자 사망 5일(유급), 처부모 사망 5일(유급), 조부모 사망 2일 중 1일(유급), 자녀 사망 5일(유급). 3일 전 신청.
  제38조(정년퇴직) 운전직·정비직: 만 65세 / 그 밖의 사원: 만 60세.
  제51조~제53조(징계사유) 음주측정 1회/0.03%미만 감봉, 2회/0.03%~0.08%미만 출근정지, 측정거부/3회/0.08%이상 징계해고.
  `;

 async function send(text) {
    const key = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert("Gemini API 키가 설정되지 않았습니다. 상단 ⚙️ 버튼을 눌러 API 키를 저장해 주세요!");
      document.getElementById('keySection').classList.remove('hidden');
      return;
    }

    const input = document.getElementById('userInput');
    const query = text || input.value.trim();
    if (!query) return;

    addMessage(query, 'user');
    if (!text) input.value = '';

    const loadingId = addMessage("AI가 취업규칙을 분석하는 중입니다...", 'bot loading');

    const systemPrompt = `
너는 삼영보영 사원 전용 '취업규칙 안내 챗봇'이야.
제시된 [삼영보영 취업규칙 내용]을 바탕으로 직원의 질문에 정확히 답변해.

[답변 규칙]
1. 반드시 규칙 내용에 명시된 사실에만 기초하여 답변할 것.
2. 모바일 화면용으로 3~4줄 이내로 핵심만 간결하게 작성할 것.
3. 관련 조항(예: 📌 관련 조항: 제20조)을 함께 표기할 것.
4. 규칙 외 내용이나 개인 데이터는 인사/노무 담당자 문의로 안내할 것.

[취업규칙 내용]
${RULE_TEXT}
    `;

    try {
      let response;
      let data;
      const maxRetries = 3;
      
      // 503 과부하 발생 시 최대 3회 자동 재시도
      for (let i = 0; i < maxRetries; i++) {
        response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: systemPrompt + "\n\n질문: " + query }] }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 800 }
          })
        });

        data = await response.json();

        // 503(서버 과부하) 발생 시 1.5초 후 자동 재시도
        if (response.status === 503 && i < maxRetries - 1) {
          await new Promise(res => setTimeout(res, 1500));
          continue;
        }
        break;
      }

      removeMessage(loadingId);

      if (data && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
        let reply = data.candidates[0].content.parts[0].text;
        reply = reply.replace(/\n/g, '<br>');
        addMessage(reply, 'bot');
      } else if (data && data.error) {
        addMessage(`⚠️ 오류 발생 (${data.error.code}): ${data.error.message}`, 'bot');
      } else {
        addMessage("답변 응답 형식이 올바르지 않습니다.", 'bot');
      }
    } catch (error) {
      removeMessage(loadingId);
      addMessage("네트워크 오류 발생: " + error.message, 'bot');
    }
  }

  function addMessage(text, className) {
    const chat = document.getElementById('chat');
    const msgDiv = document.createElement('div');
    const id = 'msg-' + Date.now();
    msgDiv.id = id;
    msgDiv.className = `msg ${className}`;
    msgDiv.innerHTML = text;
    chat.appendChild(msgDiv);
    chat.scrollTop = chat.scrollHeight;
    return id;
  }

  function removeMessage(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>
</body>
</html>
